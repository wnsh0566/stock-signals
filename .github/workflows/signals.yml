# GitHub Actions 워크플로 — repo에서는 .github/workflows/signals.yml 경로에 저장할 것
# 미국 서머타임(DST) 자동 분기: 아침 수집용 cron을 2개 걸고, 잡 안에서 뉴욕이 EDT/EST인지
# 판별해 맞는 쪽만 실행. (미장 마감 16:00 ET = 여름 20:00 UTC / 겨울 21:00 UTC)
name: fetch-signals

on:
  schedule:
    # ── 아침(미국 확정 종가) — 마감 +90분 버퍼 ──
    # ★요일은 UTC 기준. UTC 21~22시는 KST로 '다음 날' 아침이라 요일이 하루 밀린다.
    #  즉 UTC 일~금(0-5) = KST 월~토 아침. 예전 1-5는 KST 화~토라서 월요일 아침이 통째로 누락됐음.
    - cron: "30 21 * * 0-5"   # 여름(EDT)용: UTC 21:30 = KST 06:30
    - cron: "30 22 * * 0-5"   # 겨울(EST)용: UTC 22:30 = KST 07:30
    # ── 저녁(한국 확정 종가) — 한국은 서머타임 없음, 고정 ──
    # 요구(2026-07-29 상향): 16:00 KST까지 종가 확보(17:00 퇴근 전 검토). 마감 15:30·Naver 종가 ~15:40 확정.
    # ★2026-07-29 재개편(v2): 실측 지연이 날마다 다름 — 07-28 저녁 +2h35~40m + 앞쪽 2발 드랍(GitHub 큐 기아),
    #  첫 스케줄 착지 17:47. → 산탄을 더 앞으로: 명목 KST 12:12~16:12 9발.
    #  지연 0이면 앞발이 15:42까지 잡 내부 슬립(상한 13000s) 후 수집 = 15:42 착지.
    #  지연 +3h40m까지도 12:12발이 15:52 착지. concurrency로 중복 실행은 자동 병합.
    - cron: "12 3 * * 1-5"    # UTC 03:12 = KST 12:12 (+3h40 지연 시 15:52 착지)
    - cron: "42 3 * * 1-5"    # UTC 03:42 = KST 12:42
    - cron: "12 4 * * 1-5"    # UTC 04:12 = KST 13:12
    - cron: "42 4 * * 1-5"    # UTC 04:42 = KST 13:42
    - cron: "12 5 * * 1-5"    # UTC 05:12 = KST 14:12
    - cron: "42 5 * * 1-5"    # UTC 05:42 = KST 14:42
    - cron: "12 6 * * 1-5"    # UTC 06:12 = KST 15:12
    - cron: "42 6 * * 1-5"    # UTC 06:42 = KST 15:42 (지연 0 기준 정시)
    - cron: "12 7 * * 1-5"    # UTC 07:12 = KST 16:12 (최후 안전망)
  workflow_dispatch: {}        # 수동 실행 — ★장중(09:00~15:41 KST)이면 게이트가 15:42까지 대기시킴(07-29 사고 방지)

# 저녁 산탄 9발이 슬립로 겹치지 않게 직렬화 — 실행 중 1개 + 대기 1개만 유지(중간 발은 자동 취소 = 의도된 병합)
concurrency:
  group: fetch-signals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: DST gate (미국 서머타임 자동 분기)
        id: gate
        run: |
          # 뉴욕 현재 시간대 약어: 여름=EDT, 겨울=EST
          NY_TZ=$(TZ=America/New_York date +%Z)
          SCHED="${{ github.event.schedule }}"
          echo "NY=$NY_TZ / trigger=[$SCHED]"
          RUN=false
          EVENING=false
          case "$SCHED" in
            "")
              # 수동 실행 — ★한국장 장중(평일 09:00~15:41 KST)이면 저녁 취급해 15:42 게이트 적용.
              # 2026-07-29 실증: 15:26 KST 수동 실행이 게이트를 우회해 장중 스냅이 '종가'로 커밋됐음.
              RUN=true
              KM=$(( 10#$(TZ=Asia/Seoul date +%H) * 60 + 10#$(TZ=Asia/Seoul date +%M) ))
              KD=$(TZ=Asia/Seoul date +%u)   # 1=월 ... 7=일
              if [ "$KD" -le 5 ] && [ "$KM" -ge 540 ] && [ "$KM" -lt 942 ]; then
                EVENING=true
                echo "→ 수동 실행이지만 장중(KST) — 15:42 대기 게이트 적용"
              fi ;;
            "30 21 "*)         [ "$NY_TZ" = "EDT" ] && RUN=true || true ;;   # 여름 아침
            "30 22 "*)         [ "$NY_TZ" = "EST" ] && RUN=true || true ;;   # 겨울 아침
            *)                 RUN=true; EVENING=true ;;                     # 그 외 스케줄 = 전부 한국 저녁 산탄
          esac
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "evening=$EVENING" >> "$GITHUB_OUTPUT"
          [ "$RUN" = "false" ] && echo "→ 계절에 안 맞는 트리거, 스킵" || true

      - name: Wait until 15:42 KST (저녁 산탄이 장 마감 전에 착지한 경우만)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.evening == 'true'
        run: |
          # 크론 지연이 없어 15:42 KST 이전에 시작됐다면 장 마감(15:30)+Naver 확정(~15:40)까지 대기.
          # 지연 지각이면 diff가 음수라 즉시 통과. 상한 13000s(명목 12:12발이 지연 0으로 뜬 최악 케이스 커버).
          # 슬립 중 중복 발화는 concurrency 그룹이 병합하므로 러너 낭비 없음.
          NOW=$(TZ=Asia/Seoul date +%s)
          TARGET=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 15:42" +%s)
          DIFF=$(( TARGET - NOW ))
          if [ "$DIFF" -gt 0 ]; then
            [ "$DIFF" -gt 13000 ] && DIFF=13000
            echo "장 마감 전 착지 — ${DIFF}s 대기 후 수집"
            sleep "$DIFF"
          else
            echo "이미 15:42 KST 이후 — 즉시 수집"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        # 수급은 네이버 스크래핑(requests+pandas+lxml). pykrx는 KRX 수급 엔드포인트 파손으로 제외.
        run: pip install yfinance finance-datareader requests lxml

      - name: Fetch signals
        if: steps.gate.outputs.run == 'true'
        run: python fetch_signals.py

      - name: Commit result
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "signals-bot"
          git config user.email "actions@github.com"
          git add signals_data.md
          git diff --cached --quiet || git commit -m "signals: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      # ── 뉴스 헤드라인 피드 (2026-07-27 신설) — 시세와 분리, 실패해도 시세 수집 무영향 ──
      - name: Fetch news feed
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python fetch_news.py

      - name: Commit news feed
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          git add news_feed.md
          git diff --cached --quiet || git commit -m "news: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push || true
