# GitHub Actions 워크플로 — repo에서는 .github/workflows/signals.yml 경로에 저장할 것
# 미국 서머타임(DST) 자동 분기: 아침 수집용 cron을 2개 걸고, 잡 안에서 뉴욕이 EDT/EST인지
# 판별해 맞는 쪽만 실행. (미장 마감 16:00 ET = 여름 20:00 UTC / 겨울 21:00 UTC)
name: fetch-signals

on:
  schedule:
    # ── 아침(미국 확정 종가) — 마감 +90분 버퍼 ──
    # ★요일은 UTC 기준. UTC 21~22시는 KST로 '다음 날' 아침이라 요일이 하루 밀린다.
    #  즉 UTC 일~금(0-5) = KST 월~토 아침. 예전 1-5는 KST 화~토라서 월요일 아침이 통째로 누락됐음.
    - cron: "30 21 * * 0-5"   # 여름(EDT)용: UTC 21:30 = KST 06:30
    - cron: "30 22 * * 0-5"   # 겨울(EST)용: UTC 22:30 = KST 07:30
    # ── 저녁(한국 확정 종가) — 한국은 서머타임 없음, 고정 ──
    # 요구: 16:20~30 KST까지 종가 확보(17:00 퇴근 전 30분 검토). 마감 15:30·Naver 종가 ~15:40 확정.
    # ★2026-07-27 개편: UTC 06:50~07:35 크론이 매일 균일 +2h20m 지연 실측(07-22~24, 실착지 18:12~19:02 KST).
    #  크론은 늦기만 하고 이르게는 절대 발화 안 함 → "일찍 걸고, 이르면 잡 안에서 15:42 KST까지 대기" 방식으로 전환.
    #  나열 6발 = 명목 KST 14:07~16:37. 지연 0이면 앞발들이 15:42까지 슬립 후 수집, 지연 2h면 뒷발들이 안전망.
    - cron: "7 5 * * 1-5"     # UTC 05:07 = KST 14:07 (+2h20 지연 시 ~16:27 착지)
    - cron: "37 5 * * 1-5"    # UTC 05:37 = KST 14:37
    - cron: "7 6 * * 1-5"     # UTC 06:07 = KST 15:07
    - cron: "37 6 * * 1-5"    # UTC 06:37 = KST 15:37
    - cron: "7 7 * * 1-5"     # UTC 07:07 = KST 16:07
    - cron: "37 7 * * 1-5"    # UTC 07:37 = KST 16:37 (최후 안전망)
  workflow_dispatch: {}        # 수동 실행(테스트) — 항상 실행됨

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: DST gate (미국 서머타임 자동 분기)
        id: gate
        run: |
          # 뉴욕 현재 시간대 약어: 여름=EDT, 겨울=EST
          NY_TZ=$(TZ=America/New_York date +%Z)
          SCHED="${{ github.event.schedule }}"
          echo "NY=$NY_TZ / trigger=[$SCHED]"
          RUN=false
          EVENING=false
          case "$SCHED" in
            "")                RUN=true ;;                                   # 수동 실행 — 대기 없이 즉시
            "30 21 "*)         [ "$NY_TZ" = "EDT" ] && RUN=true || true ;;   # 여름 아침
            "30 22 "*)         [ "$NY_TZ" = "EST" ] && RUN=true || true ;;   # 겨울 아침
            *)                 RUN=true; EVENING=true ;;                     # 그 외 스케줄 = 전부 한국 저녁 산탄
          esac
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "evening=$EVENING" >> "$GITHUB_OUTPUT"
          [ "$RUN" = "false" ] && echo "→ 계절에 안 맞는 트리거, 스킵" || true

      - name: Wait until 15:42 KST (저녁 산탄이 장 마감 전에 착지한 경우만)
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.evening == 'true'
        run: |
          # 크론 지연이 없어 15:42 KST 이전에 시작됐다면 장 마감(15:30)+Naver 확정(~15:40)까지 대기.
          # 지연 지각(평소 +2h대)이면 diff가 음수라 즉시 통과. 상한 100분(명목 14:07발 커버).
          NOW=$(TZ=Asia/Seoul date +%s)
          TARGET=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%F) 15:42" +%s)
          DIFF=$(( TARGET - NOW ))
          if [ "$DIFF" -gt 0 ]; then
            [ "$DIFF" -gt 6000 ] && DIFF=6000
            echo "장 마감 전 착지 — ${DIFF}s 대기 후 수집"
            sleep "$DIFF"
          else
            echo "이미 15:42 KST 이후 — 즉시 수집"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"

      - name: Install deps
        if: steps.gate.outputs.run == 'true'
        # 수급은 네이버 스크래핑(requests+pandas+lxml). pykrx는 KRX 수급 엔드포인트 파손으로 제외.
        run: pip install yfinance finance-datareader requests lxml

      - name: Fetch signals
        if: steps.gate.outputs.run == 'true'
        run: python fetch_signals.py

      - name: Commit result
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "signals-bot"
          git config user.email "actions@github.com"
          git add signals_data.md
          git diff --cached --quiet || git commit -m "signals: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      # ── 뉴스 헤드라인 피드 (2026-07-27 신설) — 시세와 분리, 실패해도 시세 수집 무영향 ──
      - name: Fetch news feed
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python fetch_news.py

      - name: Commit news feed
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          git add news_feed.md
          git diff --cached --quiet || git commit -m "news: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push || true
